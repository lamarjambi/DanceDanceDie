[SystemSettings]
; Perf for integrated GPUs. M_PS1Horror pixelates to 180 rows anyway, render 3D at 60% (>=2x 180 rows keeps it clean) + FXAA.
; Fallback only: at runtime AdaptiveRes.cpp sets r.ScreenPercentage = ddd.RenderRows (432) / screen height (40% at 1080p).
; This value applies before the first viewport exists, or when ddd.RenderRows=0. See AGENTS.md > Performance.
r.ScreenPercentage=50
r.Upscale.Quality=0
r.OneFrameThreadLag=0
; Nothing sets sg.* so every group runs at Epic. These keep each effect ON but at a cost the 180-row filter can't show.
; All city lights are MOVABLE + shadowed (146 of them), so shadow cost matters most.
r.Shadow.MaxResolution=1024
r.Shadow.MaxCSMResolution=1024
r.Shadow.CSM.MaxCascades=3
r.Shadow.TexelsPerPixel=0.7
; Point/spot shadow maps at half the texel density, with the fade/min thresholds halved too (defaults 64/32) so the same
; lights keep their shadows. ShadowQuality 2 = smaller filter kernel. Both compared by screenshot on city, club and menu.
r.Shadow.TexelsPerPixelPointlight=0.35
r.Shadow.TexelsPerPixelSpotlight=0.35
r.Shadow.FadeResolution=32
r.Shadow.MinResolution=16
r.ShadowQuality=2
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=64
r.AmbientOcclusionLevels=1
r.AmbientOcclusionMaxQuality=50
r.SSR.Quality=2
r.SSR.HalfResSceneColor=1
r.BloomQuality=4
r.MotionBlurQuality=2
r.DepthOfFieldQuality=1
r.TranslucencyLightingVolumeDim=32
r.MaxAnisotropy=4
; Even frame pacing once above 60 (perf_capture.ps1 lifts this cap while measuring).
t.MaxFPS=60
